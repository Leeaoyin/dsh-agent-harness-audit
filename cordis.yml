# Development overlay. Plugin paths in a patch file MUST be absolute — the
# patch contributes configuration only and does not change how the loader
# resolves module paths.
#
#   pnpm dsh --profile web --patch ./dsh-harness-audit/cordis.yml
#
# NOTE: `web` is an alias for `--profile web` and cannot be combined with
# `--patch`; use `--profile web` as above.
#
# On Windows the path must be a `file://` URL. A bare `F:/...` is rejected by
# the ESM loader with `Received protocol 'f:'`. On POSIX, `/abs/path/...`
# works as-is.
- insert:
    - id: harness-audit
      name: 'dsh-harness-audit'
      config:
        # C14 alone is the M2 milestone: its criteria are the hardest in the
        # set, so false positives are attributable to the prompt rather than
        # to an ambiguous criterion.
        checks: ['C14']
        concurrency: 1
